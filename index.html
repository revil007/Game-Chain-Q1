<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10201f">
<title>Rantai Fun Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one-screen phone app; hazard-stripe header band, one stage card, big touch targets. Single dark arcade look by design. */
:root{
  --ink:#10201f;        /* page ground: deep plant-floor teal */
  --panel:#18302e;
  --line:#2b4b48;
  --fg:#eef5f1;
  --muted:#9fb9b3;
  --hazard:#ffc93c;     /* safety yellow */
  --go:#3ddc97;
  --stop:#ff5c5c;
  --blue:#4aa8ff;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
*{box-sizing:border-box}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hazard{height:10px;border-radius:0 0 6px 6px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,var(--ink) 12px 24px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--hazard);line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip{font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.track span{height:8px;border-radius:4px;background:var(--line)}
.track span.done{background:var(--go)}
.track span.now{background:var(--hazard)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:28px}
h2{font-size:22px}
p{margin:0;line-height:1.5;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hazard)}
button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{background:var(--hazard);color:#1b1500;font-weight:800;font-size:18px;padding:16px;border-radius:14px;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-size:15px;padding:12px}
.btn:active{transform:scale(.98)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:0;list-style:none}
.list li{font-size:14px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.list b{font-family:var(--display);font-weight:400;color:var(--hazard);font-variant-numeric:tabular-nums}
label{font-size:13px;font-weight:600;color:var(--muted)}
select,input{font:inherit;font-size:17px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--fg)}
.row{display:flex;gap:8px}
.row>*{min-width:0}
.err{color:var(--stop);font-weight:600;font-size:14px}
.qr{background:#fff;padding:14px;border-radius:14px;align-self:center;line-height:0}
.qr img,.qr canvas{width:220px!important;height:220px!important}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;text-align:center;letter-spacing:.06em;background:var(--ink);border:1px dashed var(--line);border-radius:10px;padding:10px;user-select:all;word-break:break-all}
.timer{font-family:var(--display);font-size:16px;color:var(--hazard);font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:56px;text-align:center;font-variant-numeric:tabular-nums;color:var(--hazard)}
.bar{height:14px;background:var(--ink);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--go);transition:width .08s}
.pump{aspect-ratio:1;width:min(70vw,260px);max-width:100%;align-self:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,var(--stop));font-family:var(--display);font-size:26px;color:#fff;box-shadow:0 8px 0 #9e2f2f}
.pump:active{transform:translateY(6px);box-shadow:0 2px 0 #9e2f2f}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.tile{aspect-ratio:1;border-radius:12px;background:var(--ink);border:1px solid var(--line);font-size:28px;font-weight:800;display:grid;place-items:center;max-width:100%}
.tile.back{background:repeating-linear-gradient(-45deg,#2b4b48 0 8px,#223d3a 8px 16px)}
.tile.ok{background:var(--go);color:#062b1b;border-color:var(--go)}
.tile.hit{opacity:.25}
.opt{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-size:16px;font-weight:600}
.opt.bad{border-color:var(--stop);animation:shake .3s}
.react{height:240px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:24px;text-align:center;padding:12px}
.pad{aspect-ratio:1;border-radius:18px;opacity:.35;max-width:100%}
.pad.lit{opacity:1;transform:scale(1.03)}
.slot{min-height:56px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
.slot span{width:38px;height:46px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.letters button{width:52px;height:56px;border-radius:12px;background:var(--hazard);color:#1b1500;font-family:var(--display);font-size:24px}
.letters button.used{visibility:hidden}
.slot.long{gap:4px}
.slot.long{flex-wrap:nowrap}
.slot.long span{width:28px;height:38px;font-size:17px;border-radius:6px}
.done-ring{font-family:var(--display);font-size:20px;color:var(--go);text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
th,td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--ink)}
tr:last-child td{border-bottom:0}
tr.fin td:first-child{font-family:var(--display);color:var(--hazard)}
.pill{font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--line)}
.pill.ok{background:var(--go);color:#062b1b}
.btn:disabled{opacity:.6}
.passrow{display:flex;gap:8px}
.passrow input{min-width:0;flex:1}
.passeye{flex:none;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--muted);font-weight:700;font-size:14px}
.livelink{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
.livelink i{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px rgba(61,220,151,.25)}
.livelink:active{transform:scale(.97)}
.livelink:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

.sync{text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.sync.ok{color:var(--go)}
.sync.bad{color:var(--stop)}
.cm-prompt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:14px;background:var(--ink);border:1px solid var(--line)}
.cm-k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cm-w{font-family:var(--display);font-size:clamp(40px,13vw,58px);line-height:1.05}
.cm-prompt.cm-new{animation:cmflash .25s ease-out}
@keyframes cmflash{from{transform:scale(.92);opacity:.4}}
.cm-btn{height:84px;border-radius:14px;color:#10201f;font-family:var(--display);font-size:22px;letter-spacing:.02em;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.cm-btn:active{transform:translateY(2px)}
.cm-btn.cm-bad{outline:4px solid var(--fg);animation:shake .3s}

.fin{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fin-band{position:relative;padding:22px 20px 18px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 55%,var(--ink)),var(--ink));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center;background-color:var(--ink)}
.fin-flag{width:56px;height:20px;border-radius:4px;background:repeating-conic-gradient(var(--fg) 0 25%,#10201f 0 50%) 0 0/10px 10px;box-shadow:0 0 0 2px var(--fg)}
.fin-kicker{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--hazard)}
.fin-team{font-family:var(--display);font-size:clamp(24px,8vw,34px);line-height:1.05;text-wrap:balance;display:flex;align-items:center;gap:10px;justify-content:center}
.fin-team .dot{width:18px;height:18px}
.fin-time{padding:22px 20px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.fin-label{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fin-clock{font-family:var(--display);font-size:clamp(64px,22vw,96px);line-height:1;color:var(--hazard);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.fin-sub{font-size:13px;color:var(--muted)}
.fin-list{list-style:none;margin:8px 16px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.fin-list li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ink);border:1px solid var(--line)}
.fin-list li.best{border-color:var(--go)}
.fin-no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--line);color:var(--fg)}
.fin-list li.best .fin-no{background:var(--go);color:#062b1b}
.fin-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.fin-game{font-weight:800;font-size:14px}
.fin-game em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#062b1b;background:var(--go);padding:2px 6px;border-radius:999px;vertical-align:2px;margin-left:4px}
.fin-who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.fin-bar i{display:block;height:100%;background:var(--tc);border-radius:3px}
.fin-secs{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;color:var(--fg)}
.fin-note{margin:14px 20px 0;text-align:center;font-size:13px}
.fin .btn{margin:14px 16px 16px;width:auto}

.lock{position:absolute;inset:-8px;z-index:5;border-radius:16px;background:rgba(16,32,31,.92);backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px solid var(--stop);animation:lockin .15s ease-out}
.lock-ico{font-size:40px}
.lock-t{font-weight:800;color:var(--stop);font-size:16px;padding:0 12px}
.lock-n{font-family:var(--display);font-size:64px;color:var(--fg);line-height:1;font-variant-numeric:tabular-nums}
.lock-s{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@keyframes lockin{from{opacity:0;transform:scale(1.04)}}

.valve-area{position:relative;height:min(62vh,420px);border-radius:16px;background:var(--ink);border:1px solid var(--line);overflow:hidden;touch-action:manipulation}
.valve{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}
.valve-face{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,var(--stop));box-shadow:0 4px 0 #9e2f2f;display:grid;place-items:center}
.valve span{width:40px;height:40px;border-radius:50%;border:5px solid #fff;position:relative}
.valve span::before,.valve span::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:6px;margin:-3px 0 0 -23px;background:#fff;border-radius:3px}
.valve span::after{transform:rotate(90deg)}
.valve:active .valve-face{transform:translateY(3px);box-shadow:0 1px 0 #9e2f2f}
.valve-pop.miss{color:var(--stop)}
.ink-btn{height:72px;border-radius:14px;background:var(--ink);border:1px solid var(--line);color:var(--fg);font-family:var(--display);font-size:20px}
.ink-btn:active{transform:translateY(2px)}
.grid.odd{gap:6px}
.odd-t{aspect-ratio:1;max-width:100%;border-radius:10px;border:0}
.mole-board{width:100%;max-width:340px;align-self:center;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hole{aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;overflow:hidden;padding:0;cursor:pointer;
  background:radial-gradient(circle at 50% 40%,#2a1f14,#0c0805 70%);border:3px solid #3a2b1c;box-shadow:inset 0 10px 18px rgba(0,0,0,.6);touch-action:manipulation}
.mole{position:absolute;left:50%;bottom:-100%;width:70%;height:70%;transform:translateX(-50%);border-radius:50% 50% 46% 46%;
  background:linear-gradient(160deg,#a16207,#78350f);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,34px);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:bottom .12s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.hole.up .mole{bottom:6%}
.hole.hit .mole{bottom:6%;background:linear-gradient(160deg,#4ade80,#16a34a)}
.cvalve{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border:0;padding:0;background:transparent;display:grid;place-items:center;transition:transform .15s}
.cvalve i{width:64px;height:64px;border-radius:50%;background:var(--vc);box-shadow:0 4px 0 var(--vs),inset 0 0 0 4px rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:26px;line-height:1;color:#10201f}
.cvalve:active i{transform:translateY(3px);box-shadow:0 1px 0 var(--vs),inset 0 0 0 4px rgba(255,255,255,.35)}
.vtarget{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--ink);border:2px solid var(--vc,var(--line))}
.vt-k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vt-sw{width:42px;height:42px;border-radius:50%;background:var(--vc);display:grid;place-items:center;font-size:20px;color:#10201f;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.vt-n{font-family:var(--display);font-weight:400;font-size:26px;color:var(--vc);min-width:5.2ch}
.vtarget.flash{animation:vtflash .25s ease-out}
@keyframes vtflash{from{transform:scale(.94);opacity:.5}}
.valve.safe .valve-face{background:radial-gradient(circle at 35% 30%,#8af5c4,var(--go));box-shadow:0 4px 0 #1f8a5a}
.valve.safe:active .valve-face{box-shadow:0 1px 0 #1f8a5a}
.valve{transition:transform .15s}
.valve-pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:28px;color:var(--go);pointer-events:none;animation:pop .35s ease-out forwards}
@keyframes pop{to{opacity:0;transform:translate(-50%,-90%) scale(1.3)}}

.fire-cell{font-size:34px;transition:background .1s}
.fire-cell.hot{background:#3a2316;border-color:#ff8a3c}
.fire-cell.person{background:#1d3550;border-color:var(--blue)}
.fire-cell.ouch{background:var(--stop)}
.gauge{position:relative;height:64px;border-radius:14px;background:linear-gradient(90deg,#2a4441,#3b2a2a);border:1px solid var(--line);overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--go);opacity:.85;border-radius:6px}
.gauge .needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--hazard);border-radius:3px;box-shadow:0 0 10px var(--hazard)}
.gauge.miss{animation:shake .3s}
.gmsg{text-align:center;font-weight:600}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.team{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--ink);border:1px solid var(--line);border-left:5px solid var(--tc);font-weight:700;font-size:14px;text-align:left;min-width:0}
.team span{min-width:0;overflow-wrap:anywhere}
.team.on{background:var(--panel);outline:2px solid var(--hazard);outline-offset:-2px}
.dot{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.35);vertical-align:-1px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px}

.rules{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rules h2{font-size:18px;color:var(--hazard)}
.rules ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.rules li{font-size:14px;line-height:1.5;color:var(--muted)}
.rules li::marker{font-weight:800;color:var(--hazard)}
.rules b{color:var(--fg)}
.rule-note{font-size:13px;color:var(--stop);font-weight:600}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="hazard"></div>
<div class="wrap" style="padding-top:14px">
  <header>
    <div class="brand">Rantai Fun Race<small>8 Game · 8 Pekerja · 1 Rantai</small></div>
    <span class="chip" id="teamChip" hidden></span>
    <a class="livelink" id="liveLink" href="papan.html"><i></i>Papan Live</a>
  </header>
  <div class="track" id="track" hidden></div>
  <main id="app"></main>
</div>
<script>
/* ===== Konfigurasi ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbyRE8htk8mPauI3yhOiXBK58VgtsF398IiTkRU50Zl3afz4svDJpZxvvUbyU2yvJwa-nw/exec";
// Minta no. pekerja? true = ya (hari acara), false = tidak (ujian). Tukar juga REQUIRE_STAFF dalam Code.gs.
const ASK_STAFF = false;
// Password untuk mula Game 1 (huruf besar/kecil tidak penting)
const START_PASSWORD = "sci221548";
const TEAMS = [
  {name:"Obsidian Elite", color:"#e3b21f"},
  {name:"Red Gladiators", color:"#d8362f"},
  {name:"Onyx",           color:"#1e1e28"},
  {name:"Navy Titan",     color:"#2b5aa6"},
  {name:"Pink Storm",     color:"#cf4d86"},
  {name:"Diamond X",      color:"#93a7c8"},
];
const teamColor=n=>(TEAMS.find(t=>t.name.toLowerCase()===String(n).toLowerCase())||{color:"#9fb9b3"}).color;
const dot=n=>`<i class="dot" style="background:${teamColor(n)}"></i>`;
function teamPicker(){
  const w=el(`<div><label>Pasukan</label><div class="teams" role="radiogroup"></div></div>`);
  let sel=null;const box=w.querySelector(".teams");
  TEAMS.forEach(t=>{const b=el(`<button type="button" class="team" role="radio" aria-checked="false" style="--tc:${t.color}">${dot(t.name)}<span>${t.name}</span></button>`);
    b.onclick=()=>{sel=t.name;box.querySelectorAll(".team").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-checked",x===b)})};box.append(b)});
  w.value=()=>sel;return w;
}
const BASE = location.origin + location.pathname;

/* ===== Storan phone ===== */
const store={
  get(k){try{return JSON.parse(localStorage.getItem("rfr_"+k))}catch(e){return null}},
  set(k,v){try{v===null?localStorage.removeItem("rfr_"+k):localStorage.setItem("rfr_"+k,JSON.stringify(v))}catch(e){}}
};
let DEVICE=store.get("device");
if(!DEVICE){DEVICE=Math.random().toString(36).slice(2,10)+Date.now().toString(36);store.set("device",DEVICE)}

async function api(action,data){
  if(/TAMPAL_URL/.test(API_URL)) throw new Error("API belum disetkan. Tampal URL Web App dalam index.html.");
  let r;
  try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,device:DEVICE,...data})})}
  catch(e){throw new Error("Tiada sambungan internet. Semak line dan cuba lagi.")}
  let j;try{j=await r.json()}catch(e){throw new Error("Server tidak memberi jawapan yang sah. Cuba lagi.")}
  if(!j.ok) throw new Error(j.error||"Ralat tidak diketahui.");
  return j;
}

const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const since=ms=>Math.max(0,Math.floor((Date.now()-ms)/1000));
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $app=document.getElementById("app");
const el=html=>{const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild};

function gValve(box,done){
  const N=20;let n=0,locked=false,over=false,jumpT=null,target=null;
  const C=[{n:"MERAH",h:"#ff5c5c",d:"#9e2f2f",y:"▲"},{n:"BIRU",h:"#4aa8ff",d:"#1f5f9e",y:"●"},
           {n:"KUNING",h:"#ffc93c",d:"#a07a12",y:"■"},{n:"HIJAU",h:"#3ddc97",d:"#1f8a5a",y:"◆"}];
  const s=el(`<p>Injap ditutup: <b style="color:var(--go)">0</b> / ${N}</p>`);box.append(s);
  box.append(el(`<div class="bar"><i></i></div>`));
  const tg=el(`<div class="vtarget" aria-live="polite"><span class="vt-k">Tekan injap</span><span class="vt-sw"></span><b class="vt-n"></b></div>`);box.append(tg);
  const area=el(`<div class="valve-area"></div>`);box.append(area);
  const valves=C.map(()=>{const b=el(`<button class="cvalve" type="button"><i></i></button>`);area.append(b);return b});
  box.append(el(`<p style="text-align:center;font-size:13px">Warna sasaran bertukar setiap kali. Salah warna atau tersasar = terkunci 1 saat.</p>`));
  let last={x:50,y:50};
  const pop=(x,y,txt,cls)=>{const p=el(`<span class="valve-pop ${cls||""}" style="left:${x}%;top:${y}%">${txt}</span>`);area.append(p);setTimeout(()=>p.remove(),350)};
  const far=(a,b,d)=>Math.hypot(a.x-b.x,a.y-b.y)>=d;
  const spot=avoid=>{let p,k=0;do{p={x:8+Math.random()*84,y:10+Math.random()*80};k++}while(k<60&&!avoid.every(([q,d])=>far(p,q,d)));return p};
  const setTarget=()=>{
    let t;do{t=C[Math.random()*C.length|0]}while(t===target&&Math.random()<.75);target=t;
    tg.style.setProperty("--vc",t.h);tg.querySelector(".vt-sw").textContent=t.y;tg.querySelector(".vt-n").textContent=t.n;
    tg.classList.remove("flash");void tg.offsetWidth;tg.classList.add("flash");
  };
  const place=()=>{
    clearTimeout(jumpT);if(over)return;
    const scale=1-0.35*(n/N);                                   // injap mengecil hingga ~65%
    const count=n<6?3:4;                                        // 4 warna selepas 6 injap
    const cols=[target,...shuffle(C.filter(c=>c!==target))].slice(0,count);
    const r=spot([[last,25]]);last=r;const used=[];
    valves.forEach((v,i)=>{
      if(i>=count){v.hidden=true;return}
      const c=cols[i],p=i===0?r:spot(used);used.push([p,24]);
      v.hidden=false;v._c=c;v._p=p;v.setAttribute("aria-label","Injap "+c.n.toLowerCase());
      v.style.setProperty("--vc",c.h);v.style.setProperty("--vs",c.d);v.querySelector("i").textContent=c.y;
      v.style.left=p.x+"%";v.style.top=p.y+"%";v.style.transform=`scale(${scale})`;
    });
    jumpT=setTimeout(()=>{if(!locked&&box.isConnected)place()},Math.max(650,1500-n*45));   // lompat sendiri jika lambat
  };
  const lock=async(x,y,why)=>{
    locked=true;clearTimeout(jumpT);buzz([60,40,60]);pop(x,y,"✕","miss");
    await lockOut(box,1,why);locked=false;if(!over&&box.isConnected)place();
  };
  area.addEventListener("pointerdown",e=>{e.preventDefault();if(locked||over)return;
    lock((e.offsetX/area.clientWidth*100)||50,(e.offsetY/area.clientHeight*100)||50,"Tersasar!")});
  valves.forEach(v=>v.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();if(locked||over)return;
    if(v._c!==target)return lock(v._p.x,v._p.y,"Salah warna!");
    n++;buzz(12);s.querySelector("b").textContent=n;box.querySelector(".bar i").style.width=(n/N*100)+"%";pop(v._p.x,v._p.y,"✓");
    if(n>=N){over=true;clearTimeout(jumpT);valves.forEach(x=>x.hidden=true);setTimeout(done,300);return}
    setTarget();place()}));
  setTarget();place();
}
function lockOut(box,secs,why){
  return new Promise(res=>{
    box.style.position="relative";
    const o=el(`<div class="lock" role="alert"><div class="lock-ico">🔒</div><div class="lock-t">${why}</div><div class="lock-n">${secs}</div><div class="lock-s">saat</div></div>`);
    box.append(o);let left=secs;
    const t=setInterval(()=>{left--;if(left<=0||!box.isConnected){clearInterval(t);o.remove();res()}else o.querySelector(".lock-n").textContent=left},1000);
  });
}
function gMole(box,done){
  // Ikut game5.html: 22 kena, 9 lubang, tikus naik 700ms → 300ms, jeda 180ms. Tekan lubang kosong = terkunci 5 saat.
  const PEN=5,GRACE=250;   // GRACE: tekan lewat sejurus selepas tikus turun/dikena tidak dikira salah
  const N=22,H=9,UP0=700,UPMIN=300,GAP=180;
  let hits=0,active=-1,running=true,locked=false,downT=null,spawnT=null;
  const s=el(`<p>Kena: <b style="color:var(--go)">0</b> / ${N}</p>`);box.append(s);
  box.append(el(`<div class="bar"><i></i></div>`));
  const g=el(`<div class="mole-board"></div>`);box.append(g);
  box.append(el(`<p style="text-align:center;font-size:13px">Tekan lubang kosong = terkunci ${PEN} saat.</p>`));
  const holes=[...Array(H)].map((_,i)=>{const h=el(`<button class="hole" type="button" aria-label="Lubang ${i+1}"><span class="mole">🐹</span></button>`);g.append(h);return h});
  const upMs=()=>Math.max(UPMIN,UP0-(UP0-UPMIN)*(hits/N));   // makin laju ikut bilangan kena
  const spawn=()=>{
    if(!running||!box.isConnected)return;
    let i=Math.random()*H|0;if(i===active)i=(i+1)%H;active=i;
    const h=holes[i];h.classList.remove("hit");h.classList.add("up");
    downT=setTimeout(()=>{if(!running)return;h.classList.remove("up");h._t=Date.now();active=-1;spawnT=setTimeout(spawn,GAP)},upMs());
  };
  holes.forEach((h,i)=>h.addEventListener("pointerdown",e=>{
    e.preventDefault();
    if(!running||locked)return;
    if(i!==active||!h.classList.contains("up")){
      if(Date.now()-(h._t||0)<GRACE)return;          // tekan lewat / tekan berganda: abaikan
      locked=true;clearTimeout(downT);clearTimeout(spawnT);active=-1;
      holes.forEach(x=>x.classList.remove("up"));buzz([80,50,80]);
      lockOut(box,PEN,"Salah tekan!").then(()=>{locked=false;if(running&&box.isConnected)spawnT=setTimeout(spawn,GAP)});
      return;
    }
    clearTimeout(downT);h._t=Date.now();h.classList.remove("up");h.classList.add("hit");setTimeout(()=>h.classList.remove("hit"),220);
    active=-1;hits++;buzz(12);
    s.querySelector("b").textContent=hits;box.querySelector(".bar i").style.width=(hits/N*100)+"%";
    if(hits>=N){running=false;clearTimeout(spawnT);setTimeout(done,250);return}
    spawnT=setTimeout(spawn,GAP);
  }));
  spawnT=setTimeout(spawn,600);
}
function gGauge(box,done){
  const widths=[28,25,22,19,17,15,13,11],N=widths.length;let ok=0,pos=0,dir=1,speed=0.9,zone=0,last=0,live=true,locked=false;
  const s=el(`<p>Berjaya: <b style="color:var(--go)">0</b> / ${N}</p>`);box.append(s);
  const tr=el(`<div class="gauge"><div class="zone"></div><div class="needle"></div></div>`);box.append(tr);
  const msg=el(`<p class="gmsg">Tekan KUNCI bila jarum dalam zon hijau. Terlepas = kunci 2 saat.</p>`);box.append(msg);
  const btn=el(`<button class="btn" style="font-size:22px;padding:20px">KUNCI</button>`);box.append(btn);
  const z=tr.querySelector(".zone"),n=tr.querySelector(".needle");
  const place=()=>{const w=widths[ok];zone=6+Math.random()*(88-w);z.style.left=zone+"%";z.style.width=w+"%"};place();
  const frame=t=>{if(!live||!box.isConnected)return;const dt=last?Math.min(40,t-last):16;last=t;
    pos+=dir*speed*dt/16;if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}n.style.left=pos+"%";requestAnimationFrame(frame)};
  requestAnimationFrame(frame);
  btn.addEventListener("pointerdown",async e=>{e.preventDefault();if(locked||!live)return;
    const w=widths[ok];
    if(pos>=zone&&pos<=zone+w){ok++;s.querySelector("b").textContent=ok;buzz(25);
      if(ok>=N){live=false;msg.textContent="Tekanan stabil!";setTimeout(done,400);return}
      msg.textContent=`Tepat! ${N-ok} lagi, zon makin kecil…`;speed+=0.18;place()}
    else{locked=true;buzz([80,50,80]);tr.classList.remove("miss");void tr.offsetWidth;tr.classList.add("miss");
      await lockOut(box,2,"Terlepas zon hijau!");locked=false;msg.textContent="Cuba lagi!"}
  });
}
function gWord(box,done){
  const words=["KASUT","PENGGERA","KEMALANGAN"];let wi=0;   // perkataan tetap: 5, 8, 10 huruf
  const render=()=>{box.innerHTML="";const w=words[wi];let typed="";
    box.append(el(`<div class="eyebrow">Perkataan ${wi+1} / ${words.length}</div>`));
    const slot=el(`<div class="slot${w.length>7?" long":""}"></div>`);box.append(slot);
    [...w].forEach(()=>slot.append(el(`<span></span>`)));
    const lt=el(`<div class="letters"></div>`);box.append(lt);
    let mix=shuffle([...w]);if(mix.join("")===w)mix=mix.reverse();
    const btns=mix.map(ch=>{const b=el(`<button>${ch}</button>`);lt.append(b);return b});
    const reset=()=>{typed="";btns.forEach(b=>b.classList.remove("used"));slot.querySelectorAll("span").forEach(s=>s.textContent="")};
    btns.forEach(b=>b.onclick=()=>{const ch=b.textContent;
      if(w[typed.length]===ch){b.classList.add("used");slot.children[typed.length].textContent=ch;typed+=ch;buzz(10);
        if(typed===w){wi++;setTimeout(()=>wi<words.length?render():done(),400)}}
      else{buzz(60);slot.animate?slot.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:250}):0;reset()}});
    box.append(el(`<p style="text-align:center;font-size:13px">Huruf salah = mula semula perkataan</p>`));
  };render();
}
function gMemory(box,done){
  const icons=["🍉","🚗","⚽","🎸","🌴","🐠","🏠","⭐"];
  const deck=shuffle([...icons,...icons]);let open=[],matched=0,lock=false;
  const g=el(`<div class="grid g4"></div>`);box.append(g);
  deck.forEach((ic,i)=>{const b=el(`<button class="tile back" aria-label="Kad ${i+1}"></button>`);b.dataset.ic=ic;g.append(b);
    b.onclick=()=>{if(lock||b.classList.contains("ok")||open.includes(b))return;b.classList.remove("back");b.textContent=ic;open.push(b);
      if(open.length===2){lock=true;const[a,c]=open;
        if(a.dataset.ic===c.dataset.ic){a.classList.add("ok");c.classList.add("ok");open=[];lock=false;matched++;buzz(20);if(matched===icons.length)setTimeout(done,350)}
        else setTimeout(()=>{[a,c].forEach(x=>{x.classList.add("back");x.textContent=""});open=[];lock=false},650)}}});
}
function gOrder(box,done){
  const N=20;let next=1;
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const info=el(`<p>Seterusnya: <b style="color:var(--hazard)">1</b> · nombor bertukar tempat setiap kali betul</p>`);box.append(info);
  const g=el(`<div class="grid g4"></div>`);box.append(g);
  const cells=[...Array(N)].map(()=>{const b=el(`<button class="tile"></button>`);g.append(b);return b});
  const deal=()=>{
    const left=[...Array(N-next+1)].map((_,k)=>next+k),slots=shuffle(cells);
    cells.forEach(c=>{c.dataset.n="";c.textContent="";c.classList.add("hit")});
    left.forEach((n,i)=>{const c=slots[i];c.dataset.n=n;c.textContent=n;c.classList.remove("hit")});
    if(!calm&&g.animate)g.animate([{opacity:.3},{opacity:1}],{duration:150});
  };
  cells.forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();const n=+b.dataset.n;if(!n||next>N)return;
    if(n===next){next++;buzz(10);info.querySelector("b").textContent=next>N?"✓":next;
      if(next>N){cells.forEach(c=>{c.textContent="";c.classList.add("hit")});done();return}
      deal()}
    else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("opt","bad");setTimeout(()=>b.classList.remove("opt","bad"),300);buzz(60)}}));
  deal();
}
function gOdd(box,done){
  const N=10;let r=0,locked=false;
  const s=el(`<p>Pusingan <b style="color:var(--hazard)">1</b> / ${N}</p>`);box.append(s);
  box.append(el(`<div class="bar"><i></i></div>`));
  const g=el(`<div class="grid odd"></div>`);box.append(g);
  box.append(el(`<p style="text-align:center;font-size:13px">Tekan petak yang warnanya sedikit berbeza. Salah = terkunci 5 saat.</p>`));
  const round=()=>{
    const size=r<3?3:r<6?4:5,diff=Math.max(4,22-r*2);         // beza warna makin halus
    const h=Math.random()*360|0,sat=55+Math.random()*20|0,l=45+Math.random()*12|0,lighter=Math.random()<.5;
    const odd=Math.random()*size*size|0;
    g.style.gridTemplateColumns=`repeat(${size},1fr)`;g.innerHTML="";
    for(let i=0;i<size*size;i++){const b=el(`<button class="odd-t" aria-label="Petak ${i+1}"></button>`);
      b.style.background=`hsl(${h} ${sat}% ${i===odd?(lighter?l+diff/2:l-diff/2):l}%)`;
      b.addEventListener("pointerdown",async e=>{e.preventDefault();if(locked)return;
        if(i===odd){r++;buzz(12);s.querySelector("b").textContent=Math.min(r+1,N);box.querySelector(".bar i").style.width=(r/N*100)+"%";
          if(r>=N){g.innerHTML="";setTimeout(done,250)}else round()}
        else{locked=true;buzz([80,50,80]);await lockOut(box,5,"Bukan petak itu!");locked=false}});
      g.append(b)}
  };
  round();
}
function gInk(box,done){
  const N=12;let ok=0,locked=false,target=null;
  const C=[{n:"MERAH",h:"#ff5c5c"},{n:"BIRU",h:"#4aa8ff"},{n:"HIJAU",h:"#3ddc97"},{n:"KUNING",h:"#ffc93c"}];
  const s=el(`<p>Betul: <b style="color:var(--go)">0</b> / ${N}</p>`);box.append(s);
  box.append(el(`<div class="bar"><i></i></div>`));
  const pr=el(`<div class="cm-prompt"><span class="cm-k">Tekan WARNA tulisan ini</span><span class="cm-w"></span></div>`);box.append(pr);
  const g=el(`<div class="grid g2"></div>`);box.append(g);
  box.append(el(`<p style="text-align:center;font-size:13px">Jangan baca perkataan. Lihat warnanya. Salah = terkunci 5 saat.</p>`));
  const w=pr.querySelector(".cm-w");
  const round=()=>{
    let ink;do{ink=C[Math.random()*4|0]}while(ink===target&&Math.random()<.7);target=ink;
    const word=shuffle(C.filter(c=>c!==ink))[0];w.textContent=word.n;w.style.color=ink.h;
    pr.classList.remove("cm-new");void pr.offsetWidth;pr.classList.add("cm-new");
    g.innerHTML="";
    shuffle(C).forEach(c=>{const b=el(`<button class="ink-btn">${c.n}</button>`);
      b.addEventListener("pointerdown",async e=>{e.preventDefault();if(locked||ok>=N)return;
        if(c===target){ok++;buzz(12);s.querySelector("b").textContent=ok;box.querySelector(".bar i").style.width=(ok/N*100)+"%";
          if(ok>=N){g.innerHTML="";w.textContent="✓";w.style.color="var(--go)";setTimeout(done,300)}else round()}
        else{locked=true;buzz([80,50,80]);await lockOut(box,5,"Itu perkataan, bukan warna!");locked=false}});
      g.append(b)});
  };
  round();
}

function header(){
  const chip=document.getElementById("teamChip"),tr=document.getElementById("track");
  document.getElementById("liveLink").hidden=!!S;   // hanya di muka depan
  if(!S){chip.hidden=true;tr.hidden=true;return}
  chip.hidden=false;chip.innerHTML=`${dot(S.team)}${esc(S.team)}`;
  tr.hidden=false;tr.innerHTML="";
  const cur=S.phase==="finish"?9:(S.phase==="handoff"?S.stage+1:S.stage);
  for(let i=1;i<=8;i++){const s=document.createElement("span");if(i<cur)s.className="done";else if(i===cur)s.className="now";tr.append(s)}
}
function busy(btn,on,label){btn.disabled=on;btn.textContent=on?"Sedang semak…":label}

  clearInterval(tick);S=null;header();
  $app.innerHTML="";
  const c=el(`<section class="card">
    <div class="eyebrow">Fun Race · Permainan Berantai</div>
    <h1>8 pekerja, 8 game, satu rantai.</h1>
    <p>Pekerja pertama main Game 1. Bila siap, QR keluar. Pekerja seterusnya scan dengan phone sendiri. Setiap QR sekali guna, dan setiap pekerja hanya boleh main satu game.</p>
    <ol class="list">${GAMES.map((g,i)=>`<li><b>${i+1}</b>${g.name}</li>`).join("")}</ol>

    <div ${ASK_STAFF?"":"hidden"}><label for="staff">No. pekerja anda</label><input id="staff" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="cth: SCI0123"></div>
    <div><label for="pass">Password permainan</label><div class="passrow"><input id="pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Dapatkan daripada fasilitator"><button type="button" class="passeye" id="passEye" aria-label="Tunjuk password">Tunjuk</button></div></div>
    <p class="err" id="err" hidden></p>
    <button class="btn" id="go">Mula Game 1</button>
  </section>`);
  $app.append(c);
  const tp=teamPicker();c.querySelector("#staff").parentElement.before(tp);
  const pin=c.querySelector("#pass"),eye=c.querySelector("#passEye");
  eye.onclick=()=>{const show=pin.type==="password";pin.type=show?"text":"password";eye.textContent=show?"Sorok":"Tunjuk";eye.setAttribute("aria-label",show?"Sorok password":"Tunjuk password")};
  const b=c.querySelector("#go"),err=c.querySelector("#err");
  b.onclick=async()=>{
    const staff=c.querySelector("#staff").value.trim(),team=tp.value(),pass=c.querySelector("#pass").value.trim();
    if(!team){err.textContent="Sila pilih pasukan anda.";err.hidden=false;return}
    if(!pass){err.textContent="Sila masukkan password permainan.";err.hidden=false;return}
    if(pass.toLowerCase()!==START_PASSWORD.toLowerCase()){err.textContent="Password salah. Dapatkan password daripada fasilitator.";err.hidden=false;buzz([60,40,60]);return}
    if(ASK_STAFF&&!staff){err.textContent="Sila masukkan no. pekerja.";err.hidden=false;return}
    err.hidden=true;
    startTeam(team,staff,msg=>home(msg));
  };
}

function claimView(token,hint,msg,prevStaff){
  hint=hint||{};
  if(!ASK_STAFF&&!msg) return doClaim(token,"",hint);   // tanpa no. pekerja: scan = terus tuntut
  clearInterval(tick);S=null;header();$app.innerHTML="";
  const c=el(`<section class="card">
    <div class="eyebrow">QR rantai diterima</div>
    <h1>${msg?"Tidak dapat buka game":"Giliran anda!"}</h1>
    <p>${ASK_STAFF?"Masukkan no. pekerja untuk buka game pasukan anda. ":"Tekan butang di bawah untuk cuba sekali lagi. "}QR ini akan terkunci kepada anda sebaik sahaja disahkan.</p>
    <div ${ASK_STAFF?"":"hidden"}><label for="staff">No. pekerja anda</label><input id="staff" autocomplete="off" autocapitalize="characters" placeholder="cth: SCI0123"></div>
    <p class="err" id="err" ${msg?"":"hidden"}>${msg?esc(msg):""}</p>
    <button class="btn" id="go">${ASK_STAFF?"Sahkan &amp; buka game":"Cuba lagi"}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="#">Kembali ke halaman utama</a>
  </section>`);
  $app.append(c);
  const inp=c.querySelector("#staff"),err=c.querySelector("#err");
  if(prevStaff)inp.value=prevStaff;
  c.querySelector("#go").onclick=()=>{
    const staff=inp.value.trim();
    if(ASK_STAFF&&!staff){err.textContent="Sila masukkan no. pekerja.";err.hidden=false;return}
    doClaim(token,staff,hint);
  };
}
/* Tuntut QR: arahan game dipapar serta-merta, butang MULA aktif selepas server sahkan */
async function doClaim(token,staff,hint){
  const my=++bootId;
  if(hint&&hint.stage){S={team:hint.team||"",stage:hint.stage,start:0,phase:"verify",staff};intro(true)}
  else{clearInterval(tick);S=null;header();$app.innerHTML="";
    $app.append(el(`<section class="card" style="text-align:center"><div class="eyebrow">QR rantai diterima</div><p>Membuka game pasukan anda…</p></section>`))}
  try{const j=await api("claim",{token,staff});
    if(my!==bootId)return;
    S={team:j.team,stage:j.stage,key:j.key,start:j.start,hash:token,phase:"intro",name:j.name,staff,next:j.next||""};
    confirmIntro();
  }catch(e){if(my!==bootId)return;buzz([60,40,60]);S=null;claimView(token,hint,e.message,staff)}
}
function runClock(node,prefix=""){const u=()=>{if(node.isConnected)node.textContent=prefix+fmt(since(S.start))};u();clearInterval(tick);tick=setInterval(u,1000)}

function intro(verifying){
  if(!verifying){S.phase="intro";save()}
  clearInterval(tick);header();const g=GAMES[S.stage-1];$app.innerHTML="";
  const who=S.name?`${esc(S.name)} (${esc(S.staff)})`:(ASK_STAFF?esc(S.staff||""):"");
  const c=el(`<section class="card">
    <div class="eyebrow" id="introHead" data-stage="${S.stage}" data-team="${esc(S.team)}">Game ${S.stage} / 8${S.team?` · ${esc(S.team)}`:""}</div>
    <h1>${g.name}</h1><p>${g.desc}</p>
    ${who?`<p>Pemain: <b style="color:var(--fg)">${who}</b></p>`:""}
    <div class="timer" id="tm"></div>
    <button class="btn" id="play" ${verifying?"disabled":""}>${verifying?"Sedang sahkan…":"Saya sedia — MULA"}</button>
  </section>`);$app.append(c);
  if(verifying)c.querySelector("#tm").textContent="Masa pasukan: sedang disahkan…";
  else runClock(c.querySelector("#tm"),"Masa pasukan: ");
  c.querySelector("#play").onclick=play;
}

/* Server dah sahkan: aktifkan butang tanpa lukis semula skrin (kalau game & pasukan sama) */
function confirmIntro(){
  S.phase="intro";save();
  const h=document.getElementById("introHead"),b=document.getElementById("play"),tm=document.getElementById("tm");
  if(h&&b&&tm&&+h.dataset.stage===S.stage&&h.dataset.team===S.team&&!S.name){
    header();b.disabled=false;b.textContent="Saya sedia — MULA";runClock(tm,"Masa pasukan: ");buzz(20);
  } else intro();
}
function play(){
  S.phase="play";save();const g=GAMES[S.stage-1];$app.innerHTML="";
  const c=el(`<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">Game ${S.stage} · ${g.name}</div><div class="timer" id="tm"></div></div><div id="box" style="display:flex;flex-direction:column;gap:14px"></div></section>`);
  $app.append(c);runClock(c.querySelector("#tm"));
  let fired=false;
  g.play(c.querySelector("#box"),()=>{if(fired)return;fired=true;buzz([30,40,30]);
    if(S.stage<8&&S.next){S.phase="handoff";S.pending=true;save();handoff()}   // QR sudah disediakan: papar serta-merta
    else{S.phase="sending";save();sendDone()}});
}

async function sendDone(){
  clearInterval(tick);header();$app.innerHTML="";
  const c=el(`<section class="card" style="text-align:center">
    <div class="done-ring">✓ GAME ${S.stage} SELESAI</div>
    <p id="msg">Menghantar keputusan ke server…</p>
    <button class="btn" id="retry" hidden>Cuba hantar semula</button>
  </section>`);$app.append(c);
  const r=c.querySelector("#retry"),msg=c.querySelector("#msg");
  r.onclick=sendDone;
  try{const j=await api("done",{key:S.key});
    if(j.next){S.next=j.next;S.phase="handoff";save();handoff()}
    else{S.total=j.total;S.players=j.players||[];S.phase="finish";save();finish()}
  }catch(e){if(clearIfReset(e))return;msg.textContent=e.message+" Keputusan anda tidak hilang.";msg.className="err";r.hidden=false}
}

function handoff(){
  clearInterval(tick);header();$app.innerHTML="";
  const next=S.stage+1,ti=TEAMS.findIndex(t=>t.name===S.team);
  const url=BASE+"#"+S.next+"-"+next+(ti>=0?"-"+ti:"");   // nombor game & pasukan hanya untuk paparan awal; server tetap yang sahkan
  const c=el(`<section class="card">
    <div class="done-ring">✓ GAME ${S.stage} SELESAI</div>
    <h2 style="text-align:center">Serahkan kepada pekerja seterusnya</h2>
    <p style="text-align:center">Pekerja lain scan QR ini guna <b style="color:var(--fg)">phone sendiri</b> untuk buka <b style="color:var(--fg)">Game ${next}: ${GAMES[next-1].name}</b>. QR ini hanya boleh digunakan sekali.</p>
    <div class="qr" id="qr"></div>
    <div class="timer" style="text-align:center" id="tm"></div>
    <p class="sync" id="sync" hidden></p>
    <button class="btn" id="resend" hidden>Cuba hantar semula</button>
  </section>`);$app.append(c);
  try{new QRCode(c.querySelector("#qr"),{text:url,width:440,height:440,correctLevel:QRCode.CorrectLevel.M})}
  catch(e){c.querySelector("#qr").replaceWith(el(`<p class="err">QR gagal dimuat. Muat semula halaman ini.</p>`))}
  runClock(c.querySelector("#tm"),"Masa pasukan: ");
  c.querySelector("#resend").onclick=()=>pushDone(c);
  if(S.pending)pushDone(c);
}
/* Hantar keputusan di belakang tabir sementara QR sudah dipaparkan */
async function pushDone(c){
  const sync=c.querySelector("#sync"),btn=c.querySelector("#resend");
  sync.hidden=false;sync.className="sync";sync.textContent="Menghantar keputusan…";btn.hidden=true;
  try{await api("done",{key:S.key});
    S.pending=false;save();
    if(sync.isConnected){sync.className="sync ok";sync.textContent="✓ Keputusan diterima. Rakan anda boleh scan sekarang."}
  }catch(e){
    if(clearIfReset(e))return;
    if(!sync.isConnected)return;
    sync.className="sync bad";sync.textContent=e.message+" Rakan anda belum boleh scan sehingga keputusan dihantar.";btn.hidden=false;
  }
}

function finish(){
  clearInterval(tick);header();$app.innerHTML="";
  const rows=GAMES.map((g,i)=>{const p=(S.players||[]).find(x=>x.stage===i+1)||{};
    const secs=p.claimed_ms&&p.done_ms?Math.max(0,Math.round((p.done_ms-p.claimed_ms)/1000)):null;
    return {stage:i+1,game:g.name,who:p.staff?(p.name?`${p.name} · ${p.staff}`:p.staff):"",secs}});
  finishView({team:S.team,total:S.total||0,rows,
    note:"Tunjukkan skrin ini kepada fasilitator untuk semakan nama pemain.",
    actionLabel:"Selesai — kembali ke halaman utama",
    onAction:()=>{store.set("session",null);try{history.replaceState(null,"",location.pathname)}catch(e){}home()}});
}
/* ===== Skrin TAMAT ===== */
function finishView({team,total,rows,note,actionLabel,onAction}){
  const tc=teamColor(team);
  const known=rows.filter(r=>r.secs!=null);
  const max=Math.max(1,...known.map(r=>r.secs));
  const fastest=known.length?known.reduce((a,b)=>b.secs<a.secs?b:a):null;
  const endAt=new Date().toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const c=el(`<section class="fin" style="--tc:${tc}">
    <canvas class="confetti" aria-hidden="true"></canvas>
    <div class="fin-band">
      <div class="fin-flag" aria-hidden="true"></div>
      <div class="fin-kicker">Rantai lengkap</div>
      <div class="fin-team">${dot(team)}${esc(team)}</div>
    </div>
    <div class="fin-time">
      <div class="fin-label">Masa keseluruhan</div>
      <div class="fin-clock">${fmt(total)}</div>
      <div class="fin-sub">8 game · 8 pemain · tamat ${endAt}</div>
    </div>
    <ol class="fin-list">${rows.map(r=>`
      <li class="${fastest&&r===fastest?"best":""}">
        <span class="fin-no">${r.stage}</span>
        <span class="fin-body">
          <span class="fin-game">${esc(r.game)}${fastest&&r===fastest?` <em>terpantas</em>`:""}</span>
          ${r.who?`<span class="fin-who">${esc(r.who)}</span>`:""}
          <span class="fin-bar"><i style="width:${r.secs!=null?Math.max(6,r.secs/max*100):0}%"></i></span>
        </span>
        <span class="fin-secs">${r.secs!=null?fmt(r.secs):"—"}</span>
      </li>`).join("")}
    </ol>
    <p class="fin-note">${note}</p>
    <button class="btn" id="finAct">${actionLabel}</button>
  </section>`);
  $app.append(c);
  c.querySelector("#finAct").onclick=onAction;
  confetti(c.querySelector(".confetti"),[tc,"#ffc93c","#3ddc97","#eef5f1"]);
}
function confetti(cv,colors){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){cv.remove();return}
  const ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  const W=cv.offsetWidth,H=cv.offsetHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const P=[...Array(90)].map(()=>({x:W/2+(Math.random()-.5)*60,y:H*0.18,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:colors[Math.random()*colors.length|0]}));
  let t0=performance.now();
  const step=t=>{if(!cv.isConnected)return;const e=t-t0;ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=0.22;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-e/3200);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(e<3300)requestAnimationFrame(step);else cv.remove()};
  requestAnimationFrame(step);
}

/* Phone pemain yang sudah serah QR: tunjuk semula QR jika halaman dimuat semula */
function resume(){
  const f={intro,play:intro,sending:sendDone,handoff,finish}[S.phase];
  f?f():home();
}

/* ===== Papan markah (#papan) ===== */
let boardTimer;
async function board(){
  clearInterval(tick);clearInterval(boardTimer);S=null;header();$app.innerHTML="";
  const c=el(`<section class="card">
    <div class="eyebrow">Fasilitator</div>
    <h1>Papan Kedudukan</h1>
    <p id="upd">Memuatkan…</p>
    <div class="tbl"><table><thead><tr><th>#</th><th>Pasukan</th><th>Game siap</th><th>Masa</th></tr></thead><tbody id="tb"></tbody></table></div>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="#">Halaman utama</a>
  </section>`);$app.append(c);
  const load=async()=>{
    if(!c.isConnected){clearInterval(boardTimer);return}
    try{const j=await api("board",{});
      c.querySelector("#tb").innerHTML=j.teams.length?j.teams.map((t,i)=>{
        const fin=t.total!==null;
        return `<tr class="${fin?"fin":""}"><td>${fin?i+1:"–"}</td><td>${dot(t.team)} ${esc(t.team)}</td><td><span class="pill ${fin?"ok":""}">${t.done} / 8</span></td><td>${fin?fmt(t.total):fmt(Math.max(0,Math.floor((j.now-t.start)/1000)))+" ⏱"}</td></tr>`}).join("")
        :`<tr><td colspan="4" style="text-align:center;color:var(--muted)">Belum ada pasukan bermula.</td></tr>`;
      c.querySelector("#upd").textContent="Dikemas kini "+new Date().toLocaleTimeString("ms-MY")+" · auto setiap 10 saat";
    }catch(e){c.querySelector("#upd").textContent=e.message}
  };
  load();boardTimer=setInterval(load,10000);
}

/* ===== Boot ===== */
/* ===== Mula pasukan (dari muka depan atau QR mula kertas kikis) ===== */
async function startTeam(team,staff,onFail){
  const my=++bootId;
  S={team,stage:1,start:0,phase:"verify",staff};intro(true);   // papar arahan serta-merta, server semak di belakang
  try{const j=await api("start",{team,staff,pass:START_PASSWORD});
    if(my!==bootId)return;
    S={team:j.team,stage:1,key:j.key,start:j.start,hash:"",phase:"intro",name:j.name,staff,next:j.next||""};
    try{history.replaceState(null,"",location.pathname)}catch(e){}
    confirmIntro();
  }catch(e){if(my!==bootId)return;buzz([60,40,60]);onFail(e.message)}
}
/* QR mula: #mula-<pasukan 0-5>-<kunci>. Kunci dikira daripada password, jadi QR lama jadi tidak sah bila password ditukar. */
function startKey(i){let x=2166136261;for(const c of `mula|${i}|${START_PASSWORD.toLowerCase()}`){x^=c.charCodeAt(0);x=Math.imul(x,16777619)>>>0}return x.toString(36).padStart(6,"0").slice(-6)}
function startFromQR(ti,msg){
  const team=TEAMS[ti].name;
  if(!ASK_STAFF&&!msg) return startTeam(team,"",m=>startFromQR(ti,m));
  clearInterval(tick);S=null;header();$app.innerHTML="";
  const c=el(`<section class="card">
    <div class="eyebrow">QR mula diterima</div>
    <h1>${dot(team)}${esc(team)}</h1>
    ${msg?`<p class="err">${esc(msg)}</p>`:`<p>Anda pemain pertama. Game 1 akan bermula untuk pasukan anda.</p>`}
    <div ${ASK_STAFF?"":"hidden"}><label for="staff">No. pekerja anda</label><input id="staff" autocomplete="off" autocapitalize="characters" placeholder="cth: SCI0123"></div>
    <p class="err" id="err" hidden></p>
    <button class="btn" id="go">${msg?"Cuba lagi":"Mula Game 1"}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="#">Halaman utama</a>
  </section>`);$app.append(c);
  c.querySelector("#go").onclick=()=>{
    const staff=c.querySelector("#staff").value.trim(),err=c.querySelector("#err");
    if(ASK_STAFF&&!staff){err.textContent="Sila masukkan no. pekerja.";err.hidden=false;return}
    startTeam(team,staff,m=>startFromQR(ti,m));
  };
}
/* Sesi lama: semak dengan server dulu. Kalau rekod sudah direset, mula semula dari muka depan. */
let bootId=0;
async function checkThenResume(saved){
  const my=++bootId;
  clearInterval(tick);S=null;header();$app.innerHTML="";
  $app.append(el(`<section class="card" style="text-align:center"><p>Menyemak sesi…</p></section>`));
  let valid=true;
  try{valid=!saved.key||(await api("check",{key:saved.key})).valid!==false}catch(e){/* tiada internet: teruskan sesi lama */}
  if(my!==bootId)return;
  if(!valid){
    store.set("session",null);
    try{history.replaceState(null,"",location.pathname)}catch(e){}
    return home();
  }
  S=saved;resume();
}
function clearIfReset(e){
  if(!/Sesi tidak dijumpai/i.test(e.message))return false;
  store.set("session",null);
  try{history.replaceState(null,"",location.pathname)}catch(x){}
  home("Rekod permainan sudah direset oleh fasilitator. Sila mula semula.");
  return true;
}
function boot(){
  bootId++;
  clearInterval(boardTimer);
  const h=location.hash.slice(1).toLowerCase();
  if(h==="papan") return board();
  const saved=store.get("session");
  const q=h.match(/^mula-([0-5])-([0-9a-z]{6})$/);
  if(q){
    try{history.replaceState(null,"",location.pathname)}catch(e){}
    if(startKey(+q[1])!==q[2]) return home("QR mula tidak sah. Minta QR baharu daripada fasilitator.");
    if(saved&&saved.phase&&saved.team===TEAMS[+q[1]].name) return checkThenResume(saved);
    return startFromQR(+q[1]);
  }
  const m=h.match(/^([0-9a-z]{10})(?:-([1-8]))?(?:-(\d))?$/);
  if(saved&&saved.phase&&(h===""||(m&&m[1]===saved.hash))) return checkThenResume(saved);
  if(m) return claimView(m[1],{stage:+m[2]||0,team:(TEAMS[+m[3]]||{}).name||""});
  home(h?"Kod dalam pautan tidak sah. Minta rakan tunjukkan QR semula.":"");
}
window.addEventListener("hashchange",boot);
boot();

</script>
