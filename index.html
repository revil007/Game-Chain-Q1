<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10201f">
<title>Rantai Fun Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one-screen phone app; hazard-stripe header band, one stage card, big touch targets. Single dark arcade look by design. */
:root{
  --ink:#10201f;        /* page ground: deep plant-floor teal */
  --panel:#18302e;
  --line:#2b4b48;
  --fg:#eef5f1;
  --muted:#9fb9b3;
  --hazard:#ffc93c;     /* safety yellow */
  --go:#3ddc97;
  --stop:#ff5c5c;
  --blue:#4aa8ff;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
*{box-sizing:border-box}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hazard{height:10px;border-radius:0 0 6px 6px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,var(--ink) 12px 24px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--hazard);line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip{font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.track span{height:8px;border-radius:4px;background:var(--line)}
.track span.done{background:var(--go)}
.track span.now{background:var(--hazard)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:28px}
h2{font-size:22px}
p{margin:0;line-height:1.5;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hazard)}
button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{background:var(--hazard);color:#1b1500;font-weight:800;font-size:18px;padding:16px;border-radius:14px;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-size:15px;padding:12px}
.btn:active{transform:scale(.98)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:0;list-style:none}
.list li{font-size:14px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.list b{font-family:var(--display);font-weight:400;color:var(--hazard);font-variant-numeric:tabular-nums}
label{font-size:13px;font-weight:600;color:var(--muted)}
select,input{font:inherit;font-size:17px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--fg)}
.row{display:flex;gap:8px}
.row>*{min-width:0}
.err{color:var(--stop);font-weight:600;font-size:14px}
.qr{background:#fff;padding:14px;border-radius:14px;align-self:center;line-height:0}
.qr img,.qr canvas{width:220px!important;height:220px!important}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;text-align:center;letter-spacing:.06em;background:var(--ink);border:1px dashed var(--line);border-radius:10px;padding:10px;user-select:all;word-break:break-all}
.timer{font-family:var(--display);font-size:16px;color:var(--hazard);font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:56px;text-align:center;font-variant-numeric:tabular-nums;color:var(--hazard)}
.bar{height:14px;background:var(--ink);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--go);transition:width .08s}
.pump{aspect-ratio:1;width:min(70vw,260px);max-width:100%;align-self:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,var(--stop));font-family:var(--display);font-size:26px;color:#fff;box-shadow:0 8px 0 #9e2f2f}
.pump:active{transform:translateY(6px);box-shadow:0 2px 0 #9e2f2f}
.grid{display:grid;gap:8px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.tile{aspect-ratio:1;border-radius:12px;background:var(--ink);border:1px solid var(--line);font-size:28px;font-weight:800;display:grid;place-items:center;max-width:100%}
.tile.back{background:repeating-linear-gradient(-45deg,#2b4b48 0 8px,#223d3a 8px 16px)}
.tile.ok{background:var(--go);color:#062b1b;border-color:var(--go)}
.tile.hit{opacity:.25}
.opt{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-size:16px;font-weight:600}
.opt.bad{border-color:var(--stop);animation:shake .3s}
.react{height:240px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:24px;text-align:center;padding:12px}
.pad{aspect-ratio:1;border-radius:18px;opacity:.35;max-width:100%}
.pad.lit{opacity:1;transform:scale(1.03)}
.slot{min-height:56px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
.slot span{width:38px;height:46px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.letters button{width:52px;height:56px;border-radius:12px;background:var(--hazard);color:#1b1500;font-family:var(--display);font-size:24px}
.letters button.used{visibility:hidden}
.done-ring{font-family:var(--display);font-size:20px;color:var(--go);text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
th,td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--ink)}
tr:last-child td{border-bottom:0}
tr.fin td:first-child{font-family:var(--display);color:var(--hazard)}
.pill{font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--line)}
.pill.ok{background:var(--go);color:#062b1b}
.btn:disabled{opacity:.6}
.fin{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fin-band{position:relative;padding:22px 20px 18px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 55%,var(--ink)),var(--ink));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center;background-color:var(--ink)}
.fin-flag{width:56px;height:20px;border-radius:4px;background:repeating-conic-gradient(var(--fg) 0 25%,#10201f 0 50%) 0 0/10px 10px;box-shadow:0 0 0 2px var(--fg)}
.fin-kicker{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--hazard)}
.fin-team{font-family:var(--display);font-size:clamp(24px,8vw,34px);line-height:1.05;text-wrap:balance;display:flex;align-items:center;gap:10px;justify-content:center}
.fin-team .dot{width:18px;height:18px}
.fin-time{padding:22px 20px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.fin-label{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fin-clock{font-family:var(--display);font-size:clamp(64px,22vw,96px);line-height:1;color:var(--hazard);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.fin-sub{font-size:13px;color:var(--muted)}
.fin-list{list-style:none;margin:8px 16px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.fin-list li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ink);border:1px solid var(--line)}
.fin-list li.best{border-color:var(--go)}
.fin-no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--line);color:var(--fg)}
.fin-list li.best .fin-no{background:var(--go);color:#062b1b}
.fin-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.fin-game{font-weight:800;font-size:14px}
.fin-game em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#062b1b;background:var(--go);padding:2px 6px;border-radius:999px;vertical-align:2px;margin-left:4px}
.fin-who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.fin-bar i{display:block;height:100%;background:var(--tc);border-radius:3px}
.fin-secs{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;color:var(--fg)}
.fin-note{margin:14px 20px 0;text-align:center;font-size:13px}
.fin .btn{margin:14px 16px 16px;width:auto}

.lock{position:absolute;inset:-8px;z-index:5;border-radius:16px;background:rgba(16,32,31,.92);backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px solid var(--stop);animation:lockin .15s ease-out}
.lock-ico{font-size:40px}
.lock-t{font-weight:800;color:var(--stop);font-size:16px;padding:0 12px}
.lock-n{font-family:var(--display);font-size:64px;color:var(--fg);line-height:1;font-variant-numeric:tabular-nums}
.lock-s{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@keyframes lockin{from{opacity:0;transform:scale(1.04)}}

.valve-area{position:relative;height:min(62vh,420px);border-radius:16px;background:var(--ink);border:1px solid var(--line);overflow:hidden;touch-action:manipulation}
.valve{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}
.valve-face{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,var(--stop));box-shadow:0 4px 0 #9e2f2f;display:grid;place-items:center}
.valve span{width:40px;height:40px;border-radius:50%;border:5px solid #fff;position:relative}
.valve span::before,.valve span::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:6px;margin:-3px 0 0 -23px;background:#fff;border-radius:3px}
.valve span::after{transform:rotate(90deg)}
.valve:active .valve-face{transform:translateY(3px);box-shadow:0 1px 0 #9e2f2f}
.valve-pop.miss{color:var(--stop)}
.valve-pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:28px;color:var(--go);pointer-events:none;animation:pop .35s ease-out forwards}
@keyframes pop{to{opacity:0;transform:translate(-50%,-90%) scale(1.3)}}

.fire-cell{font-size:34px;transition:background .1s}
.fire-cell.hot{background:#3a2316;border-color:#ff8a3c}
.fire-cell.person{background:#1d3550;border-color:var(--blue)}
.fire-cell.ouch{background:var(--stop)}
.gauge{position:relative;height:64px;border-radius:14px;background:linear-gradient(90deg,#2a4441,#3b2a2a);border:1px solid var(--line);overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--go);opacity:.85;border-radius:6px}
.gauge .needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--hazard);border-radius:3px;box-shadow:0 0 10px var(--hazard)}
.gauge.miss{animation:shake .3s}
.gmsg{text-align:center;font-weight:600}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.team{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--ink);border:1px solid var(--line);border-left:5px solid var(--tc);font-weight:700;font-size:14px;text-align:left;min-width:0}
.team span{min-width:0;overflow-wrap:anywhere}
.team.on{background:var(--panel);outline:2px solid var(--hazard);outline-offset:-2px}
.dot{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.35);vertical-align:-1px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px}

.rules{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rules h2{font-size:18px;color:var(--hazard)}
.rules ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.rules li{font-size:14px;line-height:1.5;color:var(--muted)}
.rules li::marker{font-weight:800;color:var(--hazard)}
.rules b{color:var(--fg)}
.rule-note{font-size:13px;color:var(--stop);font-weight:600}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="hazard"></div>
<div class="wrap" style="padding-top:14px">
  <header>
    <div class="brand">Rantai Fun Race<small>8 Game · 8 Pekerja · 1 Rantai</small></div>
    <span class="chip" id="teamChip" hidden></span>
  </header>
  <div class="track" id="track" hidden></div>
  <main id="app"></main>
</div>
<script>
/* ===== Konfigurasi ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbyRE8htk8mPauI3yhOiXBK58VgtsF398IiTkRU50Zl3afz4svDJpZxvvUbyU2yvJwa-nw/exec";
const TEAMS = [
  {name:"Obsidian Elite", color:"#e3b21f"},
  {name:"Red Gladiators", color:"#d8362f"},
  {name:"Onyx",           color:"#1e1e28"},
  {name:"Navy Titan",     color:"#2b5aa6"},
  {name:"Pink Storm",     color:"#cf4d86"},
  {name:"Diamond X",      color:"#93a7c8"},
];
const teamColor=n=>(TEAMS.find(t=>t.name.toLowerCase()===String(n).toLowerCase())||{color:"#9fb9b3"}).color;
const dot=n=>`<i class="dot" style="background:${teamColor(n)}"></i>`;
function teamPicker(){
  const w=el(`<div><label>Pasukan</label><div class="teams" role="radiogroup"></div></div>`);
  let sel=null;const box=w.querySelector(".teams");
  TEAMS.forEach(t=>{const b=el(`<button type="button" class="team" role="radio" aria-checked="false" style="--tc:${t.color}">${dot(t.name)}<span>${t.name}</span></button>`);
    b.onclick=()=>{sel=t.name;box.querySelectorAll(".team").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-checked",x===b)})};box.append(b)});
  w.value=()=>sel;return w;
}
const BASE = location.origin + location.pathname;

/* ===== Storan phone ===== */
const store={
  get(k){try{return JSON.parse(localStorage.getItem("rfr_"+k))}catch(e){return null}},
  set(k,v){try{v===null?localStorage.removeItem("rfr_"+k):localStorage.setItem("rfr_"+k,JSON.stringify(v))}catch(e){}}
};
let DEVICE=store.get("device");
if(!DEVICE){DEVICE=Math.random().toString(36).slice(2,10)+Date.now().toString(36);store.set("device",DEVICE)}

async function api(action,data){
  if(/TAMPAL_URL/.test(API_URL)) throw new Error("API belum disetkan. Tampal URL Web App dalam index.html.");
  let r;
  try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,device:DEVICE,...data})})}
  catch(e){throw new Error("Tiada sambungan internet. Semak line dan cuba lagi.")}
  let j;try{j=await r.json()}catch(e){throw new Error("Server tidak memberi jawapan yang sah. Cuba lagi.")}
  if(!j.ok) throw new Error(j.error||"Ralat tidak diketahui.");
  return j;
}

const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const since=ms=>Math.max(0,Math.floor((Date.now()-ms)/1000));
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $app=document.getElementById("app");
const el=html=>{const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild};

/* ===== 8 Game ===== */
const GAMES=[
 {name:"Pam APAR",desc:"Tekan butang merah 50 kali secepat mungkin untuk 'pam' alat pemadam api.",play:gTap},
 {name:"Padan Gambar",desc:"Buka kad dan padankan 8 pasang gambar (grid 4 × 4). Kad yang tidak sepadan akan tertutup semula.",play:gMemory},
 {name:"Padam Api",desc:"Padam 20 api yang muncul secara rawak. Mula perlahan, makin lama makin laju! Salah tekan pekerja 👷 = terkunci 3 saat, tekan petak kosong = terkunci 1 saat.",play:gFire},
 {name:"Susun 1–20",desc:"Tekan nombor 1 hingga 20 mengikut turutan. Setiap kali anda tekan nombor yang betul, nombor yang tinggal akan bertukar tempat!",play:gOrder},
 {name:"Tutup Injap",desc:"Injap merah muncul di tempat rawak. Tekan secepat mungkin untuk tutup 20 injap. Tekan tersasar = terkunci 1 saat.",play:gValve},
 {name:"Ingat Isyarat",desc:"Tengok urutan warna, kemudian ulang. 5 langkah.",play:gSimon},
 {name:"Eja Semula",desc:"Susun huruf yang bercampur menjadi perkataan keselamatan. 2 perkataan.",play:gWord},
 {name:"Tolok Tekanan",desc:"Jarum bergerak ke kiri dan kanan. Tekan KUNCI bila jarum dalam zon hijau. Perlu 8 kali, zon makin kecil dan jarum makin laju. Terlepas = terkunci 2 saat.",play:gGauge},
];

function gValve(box,done){
  const N=20;let n=0,locked=false;
  const s=el(`<p>Injap ditutup: <b style="color:var(--go)">0</b> / ${N}</p>`);box.append(s);
  box.append(el(`<div class="bar"><i></i></div>`));
  const area=el(`<div class="valve-area"></div>`);box.append(area);
  const v=el(`<button class="valve" aria-label="Tutup injap"><i class="valve-face"><span></span></i></button>`);area.append(v);
  box.append(el(`<p style="text-align:center;font-size:13px">Tekan tersasar = terkunci 1 saat</p>`));
  area.addEventListener("pointerdown",async e=>{e.preventDefault();if(locked||n>=N)return;locked=true;buzz([60,40,60]);
    const p=el(`<span class="valve-pop miss" style="left:${(e.offsetX/area.clientWidth*100)||50}%;top:${(e.offsetY/area.clientHeight*100)||50}%">✕</span>`);area.append(p);setTimeout(()=>p.remove(),350);
    await lockOut(box,1,"Tersasar!");locked=false});
  let lx=50,ly=50;
  const move=()=>{let x,y;do{x=8+Math.random()*84;y=10+Math.random()*80}while(Math.hypot(x-lx,y-ly)<25);lx=x;ly=y;v.style.left=x+"%";v.style.top=y+"%"};
  move();
  v.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();if(locked||n>=N)return;n++;buzz(12);
    s.querySelector("b").textContent=n;box.querySelector(".bar i").style.width=(n/N*100)+"%";
    const p=el(`<span class="valve-pop" style="left:${lx}%;top:${ly}%">✓</span>`);area.append(p);setTimeout(()=>p.remove(),350);
    if(n>=N){v.hidden=true;setTimeout(done,300)}else move()});
}
function lockOut(box,secs,why){
  return new Promise(res=>{
    box.style.position="relative";
    const o=el(`<div class="lock" role="alert"><div class="lock-ico">🔒</div><div class="lock-t">${why}</div><div class="lock-n">${secs}</div><div class="lock-s">saat</div></div>`);
    box.append(o);let left=secs;
    const t=setInterval(()=>{left--;if(left<=0||!box.isConnected){clearInterval(t);o.remove();res()}else o.querySelector(".lock-n").textContent=left},1000);
  });
}
function gFire(box,done){
  const N=20;let hits=0,over=false,locked=false,spawn;
  const s=el(`<p>Api dipadam: <b style="color:var(--go)">0</b> / ${N}</p>`);box.append(s);
  box.append(el(`<div class="bar"><i></i></div>`));
  const g=el(`<div class="grid g3"></div>`);box.append(g);

function gGauge(box,done){

  requestAnimationFrame(frame);
  btn.addEventListener("pointerdown",async e=>{e.preventDefault();if(locked||!live)return;

function gTap(box,done){

function gMemory(box,done){
  const icons=["🍉","🚗","⚽","🎸","🌴","🐠","🏠","⭐"];
  const deck=shuffle([...icons,...icons]);let open=[],matched=0,lock=false;
  const g=el(`<div class="grid g4"></div>`);box.append(g);
  deck.forEach((ic,i)=>{const b=el(`<button class="tile back" aria-label="Kad ${i+1}"></button>`);b.dataset.ic=ic;g.append(b);
    b.onclick=()=>{if(lock||b.classList.contains("ok")||open.includes(b))return;b.classList.remove("back");b.textContent=ic;open.push(b);
      if(open.length===2){lock=true;const[a,c]=open;

}
function gOrder(box,done){
  const N=20;let next=1;
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const info=el(`<p>Seterusnya: <b style="color:var(--hazard)">1</b> · nombor bertukar tempat setiap kali betul</p>`);box.append(info);

  const cells=[...Array(N)].map(()=>{const b=el(`<button class="tile"></button>`);g.append(b);return b});
  const deal=()=>{
    const left=[...Array(N-next+1)].map((_,k)=>next+k),slots=shuffle(cells);

    if(n===next){next++;buzz(10);info.querySelector("b").textContent=next>N?"✓":next;

}
function gSimon(box,done){

  const s=el(`<p id="sm">Perhatikan…</p>`);box.append(s);

  const round=async()=>{busy=true;pos=0;s.textContent=`Perhatikan… (${seq.length}/${L})`;await new Promise(r=>setTimeout(r,500));for(const i of seq)await flash(i);busy=false;s.textContent=`Giliran anda (${seq.length}/${L})`};
  const fresh=()=>{seq=[Math.random()*4|0];round()};
  pads.forEach((p,i)=>p.onclick=async()=>{if(busy)return;flash(i,180);
    if(i!==seq[pos]){busy=true;buzz([60,40,60]);s.textContent="Salah! Mula semula…";setTimeout(fresh,900);return}

}

function confetti(cv,colors){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){cv.remove();return}
  const ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  const W=cv.offsetWidth,H=cv.offsetHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const P=[...Array(90)].map(()=>({x:W/2+(Math.random()-.5)*60,y:H*0.18,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:colors[Math.random()*colors.length|0]}));
  let t0=performance.now();
  const step=t=>{if(!cv.isConnected)return;const e=t-t0;ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=0.22;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-e/3200);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(e<3300)requestAnimationFrame(step);else cv.remove()};
  requestAnimationFrame(step);
}

/* Phone pemain yang sudah serah QR: tunjuk semula QR jika halaman dimuat semula */
function resume(){
  const f={intro,play:intro,sending:sendDone,handoff,finish}[S.phase];
  f?f():home();
}

/* ===== Papan markah (#papan) ===== */
let boardTimer;
async function board(){
  clearInterval(tick);clearInterval(boardTimer);S=null;header();$app.innerHTML="";
  const c=el(`<section class="card">
    <div class="eyebrow">Fasilitator</div>
    <h1>Papan Kedudukan</h1>
    <p id="upd">Memuatkan…</p>
    <div class="tbl"><table><thead><tr><th>#</th><th>Pasukan</th><th>Game siap</th><th>Masa</th></tr></thead><tbody id="tb"></tbody></table></div>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="#">Halaman utama</a>
  </section>`);$app.append(c);
  const load=async()=>{
    if(!c.isConnected){clearInterval(boardTimer);return}
    try{const j=await api("board",{});
      c.querySelector("#tb").innerHTML=j.teams.length?j.teams.map((t,i)=>{
        const fin=t.total!==null;
        return `<tr class="${fin?"fin":""}"><td>${fin?i+1:"–"}</td><td>${dot(t.team)} ${esc(t.team)}</td><td><span class="pill ${fin?"ok":""}">${t.done} / 8</span></td><td>${fin?fmt(t.total):fmt(Math.max(0,Math.floor((j.now-t.start)/1000)))+" ⏱"}</td></tr>`}).join("")
        :`<tr><td colspan="4" style="text-align:center;color:var(--muted)">Belum ada pasukan bermula.</td></tr>`;
      c.querySelector("#upd").textContent="Dikemas kini "+new Date().toLocaleTimeString("ms-MY")+" · auto setiap 10 saat";
    }catch(e){c.querySelector("#upd").textContent=e.message}
  };
  load();boardTimer=setInterval(load,10000);
}

/* ===== Boot ===== */
function boot(){
  clearInterval(boardTimer);
  const h=location.hash.slice(1).toLowerCase();
  if(h==="papan") return board();
  const saved=store.get("session");
  if(saved&&saved.phase&&(h===""||h===saved.hash)){S=saved;return resume()}
  if(/^[0-9a-z]{10}$/.test(h)) return claimView(h);
  home(h?"Kod dalam pautan tidak sah. Minta rakan tunjukkan QR semula.":"");
}
window.addEventListener("hashchange",boot);
boot();
